services:
  # SAVVORA FastAPI Backend Service on Render.com
  - type: web
    name: savvora-backend
    runtime: python
    region: singapore # or oregon, frankfurt, etc.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
