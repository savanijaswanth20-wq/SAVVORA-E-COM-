<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVJ Logo</title>
<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.logo{
    width:320px;
    max-width:90%;
    filter:drop-shadow(0 0 25px rgba(255,215,0,.35));
    transition:.4s;
}

.logo:hover{
    transform:scale(1.05) rotate(-2deg);
}
</style>
</head>
<body>

<img src="images/svj-logo.png" class="logo" alt="SVJ Logo">

</body>
</html>
